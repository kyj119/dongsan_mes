# PR 자동 검증 (typecheck + entity-filter 정적 감사 + build)
#
# main에 머지하기 전 자동 검증. PR 생성/업데이트 시 작동.
# main에 직접 push만 하는 워크플로우라면 이 파일은 동작하지 않음 (PR이 없으므로).

name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Entity Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Entity filter audit
        run: node scripts/entity-audit.mjs

      - name: Build
        run: npx vite build

      # #430: write-path 회귀(0335류 FK-drop 등) 탐지. prod 무오염(로컬 D1).
      # ⚠️ 종전엔 `migrations apply` 를 0001 부터 돌렸는데 그건 **0344 에서 반드시 FK 위반으로 죽는다**
      #    (카테고리 id 환경분기 — #555). 이 워크플로가 PR 트리거라 한 번도 안 돌아 드러나지 않았다.
      #    실제 게이트는 deploy.yml 로 옮겼고, 여기는 PR 을 쓰게 될 때를 위해 같은 경로로 고쳐만 둔다.
      - name: Local write canary (bootstrap + items round-trip)
        run: npm run canary:write:ci
