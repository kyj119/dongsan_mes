# PR 자동 검증 (typecheck + entity-filter 정적 감사 + build)
#
# main에 머지하기 전 자동 검증. PR 생성/업데이트 시 작동.
# main에 직접 push만 하는 워크플로우라면 이 파일은 동작하지 않음 (PR이 없으므로).

name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Entity Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Entity filter audit
        run: node scripts/entity-audit.mjs

      - name: Build
        run: npx vite build

      # #430: write-path 회귀(0335류 FK-drop 등) 빌드 단계 탐지. prod 무오염(로컬 D1).
      # read-only smoke가 못 잡는 품목 create 회귀를 로컬 D1 마이그 적용 후 INSERT→DELETE로 포착.
      - name: Local write canary
        run: |
          npx wrangler d1 migrations apply webapp-production --local
          npm run canary:write
