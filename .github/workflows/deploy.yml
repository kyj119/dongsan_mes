# 동산기획 ERP+MES — 자동 검증 + 배포 + 헬스체크
#
# Trigger:
#   - main 브랜치 push  → 검증 → 프로덕션 배포 → 스모크 헬스체크
#   - 수동 실행 (workflow_dispatch)
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare 대시보드 → My Profile → API Tokens
#                          → "Edit Cloudflare Workers" 템플릿으로 생성
#                          (Account: All accounts, Zone resources: 불필요)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 우측 사이드바에서 복사
#   SMOKE_USER  (필수)    스모크 테스트용 계정 — 미설정 시 빈 값으로 스모크 로그인 실패
#   SMOKE_PASS  (필수)    스모크 테스트용 비밀번호 — 평문 폴백 제거(#336)
#
# 실패 시 동작:
#   - typecheck/build 실패 → 배포 차단
#   - 배포 실패 → 워크플로우 실패 (수동 재실행 필요)
#   - 스모크 실패 → 워크플로우 실패 알림 (자동 롤백은 하지 않음, 수동 대응)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify, Deploy & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      # 자체검증(selftest) — 배포 차단 게이트.
      #
      # ★왜 CI 에 있나: 이 테스트들은 2026-08-25까지 npm 스크립트로만 존재해 **아무도 자동으로 돌리지 않았다**.
      #   같은 날 여신 판정 리팩터링에서 SQL 파라미터가 한 칸씩 밀린 회귀가 prod 까지 나갔는데,
      #   typecheck·build·smoke 는 전부 통과했다(SQL 이 문법상 멀쩡했다). 값 대조 테스트만이 잡는 부류다.
      #   → 계산 규칙(청구면적·마감표기·여신·파일규격·품목중복)은 여기서 막는다.
      #
      # ⚠️ `test:calc` 만 돌린다(`test:all` 아님). `test:hookguard` 는 **제품이 아니라 개발환경**(Windows 셸
      #    위험명령 차단 규칙)을 검증하므로 Linux 러너에서 돌릴 대상이 아니다 — 로컬 전용으로 남긴다.
      - name: Self-tests (calculation gates)
        run: npm run test:calc

      # entity 필터 정적 감사 — verify.yml 에만 있어 **한 번도 돌지 않았다**(그 워크플로는 PR 트리거).
      # 법인 데이터 유출은 200 으로 나가므로 스모크가 못 잡는다. 배포 차단 게이트로 여기 둔다.
      - name: Entity filter audit
        run: node scripts/entity-audit.mjs

      # #430/#608: write-path 카나리 — read-only 스모크가 구조적으로 못 잡는 부류를 막는다
      #   (0335 FK-drop 이 items INSERT 를 전면 차단했는데 SELECT 가 멀쩡해 smoke green 으로 배포된 전례).
      #
      # ★`migrations apply` 를 0001 부터 돌리면 **0344 에서 FK 위반으로 반드시 실패한다** — 수년간의
      #   마이그 편집으로 카테고리 autoincrement id 가 환경분기(신규 replay 수성=14 vs prod 15)돼
      #   0344+ 가 하드코딩 `category_id=15` 를 참조하기 때문이다. verify.yml 의 종전 카나리 스텝이
      #   바로 그 형태라, 설령 PR 로 트리거됐어도 통과할 수 없었다(2026-08-31 실측).
      #   → 정답은 스키마 베이스라인 부트스트랩(#555) 후 0475+ 증분. ps1 은 Windows 전용이라
      #     ubuntu 러너용으로 같은 절차를 npm 스크립트(`canary:write:ci`)로 옮겼다.
      - name: Local write canary (bootstrap + items round-trip)
        run: npm run canary:write:ci

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message는 ASCII(커밋 SHA)로 고정.
          # 미지정 시 wrangler가 한글 git 커밋 메시지를 자동 전송하는데,
          # Cloudflare가 ~100바이트에서 절단하며 멀티바이트 문자를 쪼개
          # "Invalid commit message, must be valid UTF-8" [8000111]로 배포가 실패함.
          command: pages deploy dist --project-name=webapp --branch=main --commit-message="${{ github.sha }}"

      - name: Wait for deployment to propagate
        run: sleep 20

      - name: Smoke test (production)
        env:
          SMOKE_URL: https://webapp-9i0.pages.dev
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
          SMOKE_CONCURRENCY: '4'
        run: node scripts/smoke.cjs
        continue-on-error: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::배포 또는 스모크 실패. 즉시 확인 필요."
          echo "Production URL: https://webapp-9i0.pages.dev"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
