name: Daily D1 Backup

on:
  schedule:
    # 매일 KST 02:00 (UTC 17:00 전날)
    - cron: '0 17 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    # #605: CF API 지연 시 10분 타임아웃으로 해당일 백업이 통째로 누락(30일 중 2회) → 여유 + 재시도
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Export D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          MONTH=$(date +%Y-%m)
          DAY=$(date +%d)

          echo "📦 Exporting D1 database..."
          # #605: CF API 일시 지연이 그날 백업 누락으로 직결 — 3회 재시도(간격 60초)
          for i in 1 2 3; do
            if wrangler d1 export webapp-production --remote --output=backup.sql; then
              break
            fi
            echo "⚠️ export failed (attempt ${i}/3)"
            if [ "$i" = "3" ]; then exit 1; fi
            sleep 60
          done

          FILE_SIZE=$(stat --format=%s backup.sql)
          echo "✅ Export complete: backup.sql (${FILE_SIZE} bytes)"

          # 최소 크기 검증 (1KB 미만이면 실패)
          if [ "$FILE_SIZE" -lt 1024 ]; then
            echo "❌ Backup file too small — likely failed"
            exit 1
          fi

          # gzip 압축
          gzip -9 backup.sql
          COMPRESSED_SIZE=$(stat --format=%s backup.sql.gz)
          echo "📁 Compressed: backup.sql.gz (${COMPRESSED_SIZE} bytes)"

          # 일별 백업 → R2
          # ★--remote 필수 — wrangler 4 의 r2 object 는 기본이 **로컬(Miniflare)** 이라, 없으면
          #   러너 디스크에만 쓰고 성공으로 끝난다(로그 「Resource location: local」 = 백업이 R2 에 없었다).
          echo "☁️ Uploading daily backup to R2..."
          set -o pipefail   # tee 가 wrangler 실패 코드를 삼키지 않게
          wrangler r2 object put "dongsan-backups/daily/${DATE}.sql.gz" --remote \
            --file=backup.sql.gz \
            --content-type="application/gzip" 2>&1 | tee put.log
          if grep -q "Resource location: local" put.log; then echo "❌ R2 upload went to local storage"; exit 1; fi

          # 매월 1일이면 월별 백업도 저장
          if [ "$DAY" = "01" ]; then
            echo "📅 Monthly backup: ${MONTH}"
            wrangler r2 object put "dongsan-backups/monthly/${MONTH}.sql.gz" --remote \
              --file=backup.sql.gz \
              --content-type="application/gzip"
          fi

          echo "✅ Backup uploaded successfully"

      # 90일 지난 daily/ 는 **R2 수명주기 규칙**이 지운다(2026-09-26, 규칙 'expire-daily-90d').
      #   예전 정리 단계는 wrangler 4 에 없는 `r2 object list` 를 부르고 2>/dev/null 로 에러를 삼킨 채
      #   「Cleanup complete」를 찍어, 한 번도 지운 적이 없었다. monthly/ 는 영구 보관.
      #   확인: npx wrangler r2 bucket lifecycle list dongsan-backups

      - name: Summary
        if: always()
        run: |
          echo "### 📊 Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: webapp-production" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
